# Add TLS and your verified server_name at the existing ingress. Do not replace shared config.
# Apply these directives within the dedicated app server/location only.
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Do not trust a browser-supplied Cloudflare identity header.
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 60s;
    client_max_body_size 32k;
}
